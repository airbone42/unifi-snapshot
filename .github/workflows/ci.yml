name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"
      - name: Paket installieren
        run: python -m pip install .
      - name: Console-Script vorhanden
        run: unifi-snapshot --version
      - name: Tests
        run: python -m unittest discover -s tests -v

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - name: gitleaks (komplette Historie)
        # Docker-Image mit festem Tag statt gitleaks-action, braucht keine Lizenz für Organisationen.
        # Lauf als Runner-User, damit git die gemountete Arbeitskopie nicht als "dubious ownership" ablehnt.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.24.0 \
            git /repo --gitleaks-ignore-path /repo --redact --verbose --exit-code 1
